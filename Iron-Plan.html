<title>Iron Plan – 6-day machine program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6;--sf:#ffffff;--sf2:#e3e8f1;--tx:#0f1729;--mu:#566178;--ln:#d3dae7;
  --ac:#2f5cff;--on:#ffffff;--acs:#dfe6ff;--gold:#e8a800;--ok:#12805c;--warn:#b4501a;
  --fig:#0f1729;--mach:#8d99b0;
  --hd:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --bd:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1220;--sf:#151d30;--sf2:#1d2740;--tx:#eef2fb;--mu:#9aa6bf;--ln:#27324d;
    --ac:#7c97ff;--on:#0c1220;--acs:#1f2b52;--gold:#ffc83a;--ok:#3ddba3;--warn:#ff9a62;
    --fig:#eef2fb;--mach:#5f6d8c;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1220;--sf:#151d30;--sf2:#1d2740;--tx:#eef2fb;--mu:#9aa6bf;--ln:#27324d;
  --ac:#7c97ff;--on:#0c1220;--acs:#1f2b52;--gold:#ffc83a;--ok:#3ddba3;--warn:#ff9a62;
  --fig:#eef2fb;--mach:#5f6d8c;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:var(--bd);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-size:16px}
.dcr{display:flex;gap:12px;align-items:flex-start;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-top:8px}
.dcr .ic{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:var(--mach)}
.dcr.ok .ic{background:var(--ok)}
.dcr.warn .ic{background:#c98400}
.dcr.bad .ic{background:#c4381a}
.dcr small{display:block;color:var(--mu);font-size:14px;margin-top:2px}
.dcr b{font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 140px}
h1,h2,h3{font-family:var(--hd);margin:0;line-height:1;letter-spacing:.2px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}

/* gate */
.brand{font-family:var(--hd);font-weight:900;font-size:64px;line-height:.9;letter-spacing:1px;margin:18px 0 6px}
.sub{color:var(--mu);margin:0 0 18px;max-width:34ch}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 16px}
.dchip{background:var(--sf);border:1.5px solid var(--ln);border-radius:12px;padding:8px 0 7px;text-align:center;display:flex;flex-direction:column;gap:1px}
.dchip b{font-family:var(--hd);font-size:20px;font-weight:800}
.dchip small{font-size:10.5px;color:var(--mu);line-height:1.1}
.dchip.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.dchip.on small{color:var(--on);opacity:.85}
.dchip.today:not(.on){border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px}
.card+.card{margin-top:12px}
.dcard h2{font-size:34px;font-weight:800}
.dcard p{margin:6px 0 0;color:var(--mu)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-block;background:var(--sf2);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.chip.ok{background:var(--acs);color:var(--ac)}
.chip.late{background:#ffe6d6;color:#9b3d0a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.late{background:#4a2a18;color:#ffb48a}}
.code{margin-top:14px}
.code label{display:block;font-weight:700;margin-bottom:8px}
.row{display:flex;gap:8px}
.inp{flex:1;min-width:0;background:var(--bg);border:2px solid var(--ln);border-radius:14px;padding:14px;font:inherit;font-size:20px;font-weight:700;letter-spacing:2px;color:var(--tx);text-transform:uppercase}
.inp::placeholder{letter-spacing:0;font-weight:500;font-size:16px;text-transform:none;color:var(--mu)}
.inp.bad{border-color:var(--warn);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:17px}
.btn.big{width:100%;padding:18px;font-size:19px;border-radius:16px}
.btn.alt{background:var(--sf2);color:var(--tx)}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.45}
.ghost{background:transparent;border:1.5px solid var(--ln);border-radius:12px;padding:7px 12px;font-weight:600;font-size:14px}
.link{background:none;border:0;color:var(--ac);font-weight:600;padding:8px 0;font-size:14px;text-decoration:underline}
.hint{color:var(--mu);font-size:14px;margin:8px 0 0}
.err{color:var(--warn);font-size:14px;margin:8px 0 0;min-height:20px}

/* session top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:560px;margin:0 auto}
.tl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:14px}
.tl b{font-family:var(--hd);font-size:22px;font-weight:800;margin-right:4px}
.clock{font-family:var(--hd);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.prog{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:5;height:4px;background:var(--sf2);max-width:560px;margin:0 auto}
.prog i{display:block;height:100%;background:var(--ac);transition:width .4s}
.sec{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}

/* figure */
.stage{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:20px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.cap{padding:10px 14px 12px;border-top:1px solid var(--ln);font-weight:600;font-size:15px;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cap small{color:var(--mu);font-weight:500;font-size:12px;white-space:nowrap}
.lg{stroke:var(--fig);stroke-width:7;stroke-linecap:round;fill:none}
.tr{stroke:var(--fig);stroke-width:9;stroke-linecap:round;fill:none}
.ar{stroke:var(--fig);stroke-width:5.5;stroke-linecap:round;fill:none}
.l2{stroke:var(--fig);stroke-width:6;stroke-linecap:round;opacity:.38;fill:none}
.hd{fill:var(--fig)}
.mf{stroke:var(--mach);stroke-width:4;stroke-linecap:round;fill:none}
.mp{fill:var(--ac);opacity:.9}
.padl{stroke:var(--ac);stroke-width:12;stroke-linecap:round;opacity:.9;fill:none}
.cb{stroke:var(--mu);stroke-width:1.6;fill:none}
.st{fill:var(--sf2);stroke:var(--mach);stroke-width:2}
.sl{stroke:var(--mach);stroke-width:1;opacity:.5}
.bar{fill:var(--gold)}
.gr{stroke:var(--mach);stroke-width:3;stroke-linecap:round}
.belt{stroke:var(--mach);stroke-width:5;stroke-dasharray:12 9;stroke-linecap:round}
.lb{font:600 9.5px var(--bd);fill:var(--mu)}

h2.ex{font-size:40px;font-weight:800;margin:16px 0 4px}
.mach{color:var(--mu);margin:0 0 8px;font-size:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.photo{display:inline-block;color:var(--ac);font-weight:700;text-decoration:underline;font-size:15px;margin:2px 0 6px}
.alt-line{font-size:14px;color:var(--mu);margin:2px 0 0}
.setbox{margin-top:12px;display:grid;gap:12px}
.pills{display:flex;gap:8px}
.pill{flex:1;text-align:center;border-radius:12px;padding:10px 0;font-family:var(--hd);font-weight:800;font-size:22px;background:var(--sf2);color:var(--mu)}
.pill.cur{background:var(--ac);color:var(--on)}
.pill.done{background:var(--ok);color:#fff}
.target{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.target .big{font-family:var(--hd);font-size:44px;font-weight:800;line-height:1}
.target span{color:var(--mu);font-size:14px}
.wt{display:flex;align-items:center;gap:8px}
.wt button{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--ln);background:var(--sf);font-size:24px;font-weight:700}
.wt input{width:96px;text-align:center;font:inherit;font-size:22px;font-weight:700;padding:8px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);color:var(--tx)}
.wt small{color:var(--mu)}
.rest{text-align:center;padding:18px 12px}
.rest .rb{font-family:var(--hd);font-size:96px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.rest p{margin:4px 0 0;color:var(--mu)}
.meter{height:8px;border-radius:99px;background:var(--sf2);overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;background:var(--ac);width:0}
details{background:var(--sf);border:1px solid var(--ln);border-radius:16px;margin-top:10px}
summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;color:var(--mu)}
details[open] summary::after{content:"–"}
details ol,details ul{margin:0;padding:0 16px 14px 36px}
details li{margin:0 0 9px}
details li::marker{font-weight:700;color:var(--ac)}
.tip{background:var(--acs);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:15px}
.safe{background:#fff3d6;color:#5b3d00;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .safe{background:#3a2f12;color:#ffe09a}}
.tm{text-align:center;padding:16px 12px}
.tm .tb{font-family:var(--hd);font-size:88px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.tm .pl{font-weight:700;font-size:18px;margin-top:2px}
.tm small{color:var(--mu)}
.tl-list{list-style:none;margin:0;padding:0}
.tl-list li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln);align-items:baseline}
.tl-list li:last-child{border:0}
.tl-list .tt{width:44px;font-family:var(--hd);font-weight:800;font-size:20px;color:var(--ac);font-variant-numeric:tabular-nums}
.tl-list .nm{flex:1}
.tl-list .nm small{display:block;color:var(--mu)}
.tl-list .mn{color:var(--mu);font-size:14px;white-space:nowrap}
.bar-b{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-b .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.bar-b .btn{flex:1}
.bar-b .btn.alt{flex:0 0 auto}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:rgba(5,10,22,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:30px;font-weight:800;margin-bottom:6px}
.jump{display:flex;gap:10px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:11px 12px;margin-top:8px;align-items:center}
.jump.cur{border-color:var(--ac);border-width:2px}
.jump .dot{width:22px;height:22px;border-radius:50%;background:var(--sf2);flex:0 0 22px;display:grid;place-items:center;font-size:13px;font-weight:800}
.jump.d .dot{background:var(--ok);color:#fff}
.jump small{color:var(--mu);display:block}
.fin h2{font-size:56px;font-weight:900}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat div{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px}
.stat b{display:block;font-family:var(--hd);font-size:38px;font-weight:800;line-height:1}
.stat span{color:var(--mu);font-size:14px}

.dchip{position:relative}
.ck{position:absolute;top:2px;right:4px;font-style:normal;font-size:11px;font-weight:800;color:var(--ok)}
.dchip.on .ck{color:var(--on)}
.resume{border:2px solid var(--ac)}
.resume h3{font-size:28px;font-weight:800;margin-bottom:4px}
.resume p{margin:0 0 12px;color:var(--mu)}
.resume p b{color:var(--tx)}
.svd{font-size:12px;color:var(--ok);font-weight:700;min-width:54px;text-align:right}
.prow{display:flex;gap:6px;align-items:stretch;margin-top:8px}
.prow .jump{margin-top:0;flex:1;min-width:0}
.prow .jump b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv{flex:0 0 44px;border:1px solid var(--ln);background:var(--sf);border-radius:12px;font-size:15px;font-weight:700}
.mv.wide{flex:0 0 64px;font-size:14px}
.jump.sk{opacity:.65}
.jump.sk .dot{background:var(--mach);color:#fff}
.opt{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:13px 14px;margin-top:8px}
.opt b{display:block;font-size:16px}
.opt small{display:block;color:var(--mu);margin-top:2px;font-size:13.5px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-12px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

.gymc{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gymc small{display:block;color:var(--mu);margin-top:2px;font-size:13.5px}
.gh{font-size:24px;font-weight:800;margin:16px 0 6px}
.gear{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sf);border:1.5px solid var(--ln);border-radius:14px;padding:12px 14px;margin-top:6px;font-weight:600}
.gear .bx{flex:0 0 26px;height:26px;border-radius:8px;border:2px solid var(--ln);display:grid;place-items:center;font-weight:800;color:var(--on)}

.psec{font-family:var(--hd);font-weight:800;font-size:19px;margin:14px 0 4px;color:var(--mu)}
.pr2{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--ln);border-radius:14px;padding:10px 12px;margin-top:6px}
.pr2 .bx{flex:0 0 26px;height:26px;border-radius:8px;border:2px solid var(--ln);display:grid;place-items:center;font-weight:800;color:var(--on)}
.pr2.on{border-color:var(--ac);background:var(--sf)}
.pr2.on .bx{background:var(--ac);border-color:var(--ac)}
.pr2 .nm{flex:1;min-width:0;font-weight:600}
.pr2 small{display:block;color:var(--mu);font-weight:500;font-size:13px}
.pr2 .tt2{font-family:var(--hd);font-weight:800;font-size:19px;color:var(--ac);font-variant-numeric:tabular-nums}
.pr2:not(.on) .nm{opacity:.7}
.pr2.lock{opacity:.65}
.lbl{display:block;font-weight:700;margin:12px 0 6px}
.txt{display:block;width:100%;background:var(--bg);border:1.5px solid var(--ln);border-radius:12px;padding:12px;font:inherit;color:var(--tx)}
textarea.txt{font-size:16px;line-height:1.4;resize:vertical}
.stack{display:grid;gap:8px;margin-top:12px}
@media (prefers-reduced-motion:reduce){.inp.bad{animation:none}.prog i{transition:none}}

var animCur=null,animKey='',paused=false,raf=0,lastCue='',lastBase='';
function mountAnim(key){
  animKey=key;animCur=key?A[key]:null;lastCue='';
  if(animCur){prep(animCur);}
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)paused=true;
  if(!raf)raf=requestAnimationFrame(loop);
}
function frame(c,t){
  var p,ph=0,pv=0;
  if(c.fn){p=c.fn(t,c);}
  else{ph=(t%c.T)/c.T;pv=pp(ph);p=mix(c.a,c.b,pv);fixPose(p,c,pv);}
  var mm=c.m?c.m(p,t):{b:'',f:''};
  return {p:p,ph:ph,b:mm.b,f:mm.f,body:body(p)};
}
function loop(now){
  raf=requestAnimationFrame(loop);
  var g=document.getElementById('fig');
  if(!g||!animCur||paused)return;
  var r=frame(animCur,now/1000);
  document.getElementById('back').innerHTML=r.b;
  g.innerHTML=r.body;
  document.getElementById('front').innerHTML=r.f;
  var cue=animCur.cue?(animCur.fn?animCur.cue[0]:(r.ph<.5?animCur.cue[0]:animCur.cue[1])):'';
  if(cue!==lastCue){lastCue=cue;var cp=document.getElementById('cue');if(cp)cp.textContent=cue;}
}
function figureHTML(key,note){
  var c=A[key];if(!c)return '';
  var labs=(c.lab||[]).map(function(l){return '<text class="lb" x="'+l[1]+'" y="'+l[2]+'" text-anchor="'+(l[3]||'middle')+'">'+l[0]+'</text>'}).join('');
  var tf=c.incl?' transform="rotate(-'+c.incl+' 150 172)"':'';
  return '<div class="stage" data-act="anim"><svg viewBox="0 0 300 190" role="img" aria-label="Animated machine diagram">'+
    '<line class="gr" x1="10" y1="172" x2="290" y2="172"/>'+
    '<g'+tf+'><g id="back"></g><g id="fig"></g><g id="front"></g></g>'+
    '<g>'+labs+'</g></svg>'+
    '<div class="cap"><span id="cue"></span><small>tap to pause</small></div></div>';
}

function eqOf(e){if(EQ[e.id])return EQ[e.id];if(/^inc\d/.test(e.id))return 'treadmill';if(/^bike\d/.test(e.id))return 'bike';return ''}
function gymMissing(){return (MEM&&MEM.gym&&MEM.gym.missing)||[]}
function applyGym(steps,miss,omitted,off){
  off=off||[];
  if(!miss.length&&!off.length)return steps;
  var has=function(q){return !q||miss.indexOf(q)<0},out=[];
  var taken={};steps.forEach(function(s){taken[s.e.id]=1});
  steps.forEach(function(s){
    var q=eqOf(s.e),isOff=off.indexOf(s.e.id)>=0;
    if(!isOff&&has(q)){out.push(s);return}
    var sub=null,o=s.e;
    if(isOff&&(o.kind==='stretch'||o.custom)){omitted.push(o.name);return}
    if(s.t==='ex'){
      (SUB[o.id]||[]).some(function(id){
        if(E[id]&&has(eqOf(E[id]))&&!taken[id]){sub=X(id,{sets:o.sets,mins:o.mins});taken[id]=1;return true}
        return false;
      });
    }else if(o.kind==='warm'){
      if(has('bike')&&o.anim!=='bike')sub=mkTimed(T.warmbike);
    }else if(o.kind==='cardio'){
      var m=Math.max(5,Math.round(o.total/60));
      if(has('bike')&&o.anim!=='bike')sub=mkTimed(tBike(m));
      else if(has('treadmill')&&o.anim!=='incline'&&o.anim!=='treadmill')sub=mkTimed(tInc(m));
      else if(has('treadmill')&&!isOff)sub=mkTimed(tInc(m));
    }
    if(sub){s.rep=o.name;s.e=sub;out.push(s)}else omitted.push(o.name);
  });
  return out;
}
function gymPreview(miss){
  var lines=[];
  DAYS.forEach(function(d,i){
    if(d.rest)return;
    var st=buildSteps(i,miss),parts=[];
    st.forEach(function(s){if(s.rep)parts.push(s.rep+' → '+s.e.name)});
    (st.omitted||[]).forEach(function(n){parts.push(n+' removed')});
    if(parts.length)lines.push({d:d.short,p:parts});
  });
  return lines;
}

function mkTimed(t){var o=Object.assign({},t);if(!o.total)o.total=o.segs.reduce(function(a,s){return a+s[1]},0);return o}

  miss=miss||gymMissing();off=off||[];
  var d=DAYS[di],steps=[];
  steps.push({t:'timed',e:mkTimed(d.warm),sec:'Warm-up'});
  var xs=d.ex.map(function(e){return {t:'ex',e:e,sec:'Machines'}});
  customFor(di).forEach(function(c){xs.push({t:'ex',e:c,sec:'Machines'})});
  if(d.extra){ // Saturday: cardio first, then light core, then bike
    d.extra.slice(0,2).forEach(function(c){steps.push({t:'timed',e:mkTimed(c),sec:'Stamina'})});
    xs.forEach(function(s){steps.push(s)});
    steps.push({t:'timed',e:mkTimed(d.extra[2]),sec:'Stamina'});
  }else{
    xs.forEach(function(s){steps.push(s)});
    if(d.fin)steps.push({t:'timed',e:mkTimed(d.fin),sec:'Stamina finish'});
  }
  d.str.forEach(function(k){steps.push({t:'timed',e:mkTimed(S[k]),sec:'Stretch, no machine'})});
  var omitted=[];steps=applyGym(steps,miss,omitted,off);

  steps.forEach(function(s,k){s.k=k;s.st='todo';s.prog=0;s.sw='';s.orig=s.e;s.mins=s.t==='ex'?s.e.mins:s.e.total/60+(s.e.kind==='stretch'?.5:1);s.plan=cum;cum+=s.mins});

}

function phases(e){
  if(!e.cycle)return e.segs.map(function(s){return {l:s[0],s:s[1]}});
  var out=[],tot=0;
  while(tot<e.total-0.1){for(var i=0;i<e.segs.length;i++){if(tot>=e.total-0.1)break;var s=Math.min(e.segs[i][1],e.total-tot);out.push({l:e.segs[i][0],s:s});tot+=s;}}

}

function swapped(orig,sw){
  if(!sw)return orig;
  if(sw.indexOf('ex:')===0)return X(sw.slice(3),{sets:orig.sets,mins:orig.mins});
  var m=Math.max(5,Math.round((orig.total||600)/60));
  if(sw==='ti')return mkTimed(tInc(m));

  if(sw==='tw')return mkTimed(T.warmbike);

}
function altOptions(s){

  if(s.t==='ex'){
    if(o.altId&&E[o.altId]&&!used(o.altId)&&s.e.id!==o.altId)out.push({sw:'ex:'+o.altId,label:'Swap to '+E[o.altId].name,note:'Works the same muscles. Setup steps and animation are included.'});
  }else if(o.kind==='warm'){
    if(s.sw!=='tw')out.push({sw:'tw',label:'Swap to bike warm-up',note:'6 minutes of easy spinning instead of the treadmill.'});
  }else if(o.kind==='cardio'){
    var m=Math.round(o.total/60);
    if(s.sw!=='ti'&&o.anim!=='incline')out.push({sw:'ti',label:'Swap to incline treadmill walk',note:m+' minutes at a steady pace.'});
    if(s.sw!=='tb'&&o.anim!=='bike')out.push({sw:'tb',label:'Swap to stationary bike',note:m+' minutes, steady with short pushes.'});

}

  sv.steps.forEach(function(o){

function beep(n){
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();

function tmToggle(){

  if(!sess.tm){sess.tm={ph:phases(st.e),acc:0,run:false,start:0,done:false,last:-1}}
  var t=sess.tm;if(t.done)return;
  if(t.run){t.acc+=Date.now()-t.start;t.run=false;stopTick()}

  render();tmTick();

function tmTick(){
  if(!sess||!sess.tm)return;
  var t=sess.tm,el=timerElapsed(t)/1000,acc=0,idx=t.ph.length-1,rem=0,tot=0;
  t.ph.forEach(function(p){tot+=p.s});
  for(var i=0;i<t.ph.length;i++){if(el<acc+t.ph[i].s){idx=i;rem=acc+t.ph[i].s-el;break}acc+=t.ph[i].s}
  var fin=el>=tot;
  if(idx!==t.last){if(t.last>=0&&!fin){beep(1);toast(t.ph[idx].l)}t.last=idx}
  if(fin){t.done=true;if(t.run){t.run=false;t.acc=tot*1000}stopTick();beep(3);render();return}
  var big=document.getElementById('tb'),pl=document.getElementById('tp'),tt=document.getElementById('tt'),mt=document.getElementById('tmm');

  if(mt)mt.style.width=(100*el/tot)+'%';

function moveStep(i,dir){
  var a=sess.steps,j=i+dir;
  while(j>=0&&j<a.length&&a[j].st!=='todo')j+=dir;
  if(j<0||j>=a.length)return;
  var cur=a[sess.i],t=a[i];a[i]=a[j];a[j]=t;
  sess.i=cur?a.indexOf(cur):-1;
  replan();saveSess(true);$('#ov').innerHTML=planHTML();

function doLater(){
  var a=sess.steps,s=a[sess.i],nxt=nextTodo(),nobj=nxt>=0?a[nxt]:null;

  a.splice(sess.i,1);
  var last=-1;a.forEach(function(x,k){if(x.sec===s.sec)last=k});
  a.splice(last+1,0,s);
  replan();
  if(!nobj||nobj===s){sess.i=a.indexOf(s);toast('This is the only step left.');enter(sess.i);return}
  toast('Moved to the end of '+s.sec.toLowerCase()+'.');

  if(a==='discard'){if(G.disc){G.disc=false;clearSess();render()}else{G.disc=true;render()}return}
  if(!sess)return;
  if(a==='begin'){sess.start=Date.now();enter(nextTodo()<0?0:Math.max(0,sess.steps.findIndex(function(s){return s.st==='todo'})));return}
  if(a==='go'){sess.stage='set';saveSess(true);render();return}
  if(a==='wt'){var wi0=document.getElementById('wti');if(wi0){var v=parseFloat(wi0.value||'0')+parseFloat(t.getAttribute('data-d'));wi0.value=Math.max(0,v)}return}
  if(a==='setdone'){
    var st=sess.steps[sess.i],e=st.e,wi=document.getElementById('wti');
    st.prog=(st.prog||0)+1;sess.setsDone++;
    if(wi&&wi.value!==''){
      var arr=sess.wl[e.id]=sess.wl[e.id]||[];arr[st.prog-1]=wi.value;
      MEM.w[e.id]={d:ymd(),ws:arr.filter(function(x){return x!==undefined&&x!==null&&x!==''})};saveMem();
    }
    if(st.prog<e.sets){startRest(e.rest)}else{st.st='done';bump('done',e.id);advance()}
    return;
  }
  if(a==='skiprest'){endRest();return}
  if(a==='plus15'){if(sess.rest){sess.rest.end+=15000;sess.rest.len+=15}return}
  if(a==='tm'){tmToggle();return}
  if(a==='nextstep'){sess.steps[sess.i].st='done';bump('done',sess.steps[sess.i].e.id);advance();return}
  if(a==='plan'){ov.innerHTML=planHTML();return}
  if(a==='busy'){ov.innerHTML=busyHTML();return}
  if(a==='closeov'){if(t.classList.contains('ov')&&ev.target!==t)return;ov.innerHTML='';return}
  if(a==='jump'){
    ov.innerHTML='';var ji=+t.getAttribute('data-i');
    if(sess.i<0)sess.start=Date.now();
    if(ji===sess.i&&sess.i>=0)return;
    enter(ji);return;
  }
  if(a==='mv'){moveStep(+t.getAttribute('data-i'),+t.getAttribute('data-d'));return}
  if(a==='redo'){var ri=+t.getAttribute('data-i'),rs=sess.steps[ri];rs.st='todo';rs.prog=0;ov.innerHTML='';if(sess.i<0)sess.start=Date.now();enter(ri);return}
  if(a==='later'){ov.innerHTML='';doLater();return}
  if(a==='swap'){ov.innerHTML='';doSwap(t.getAttribute('data-sw'));return}
  if(a==='skiptoday'){ov.innerHTML='';sess.steps[sess.i].st='skipped';bump('skipped',sess.steps[sess.i].e.id);sess.skipped++;advance();return}
  if(a==='exit'){ov.innerHTML='';saveSess();sess=null;stopTick();render();window.scrollTo(0,0);return}
  if(a==='endnow'){ov.innerHTML='';finish();return}
  if(a==='home'){sess=null;stopTick();render();window.scrollTo(0,0);return}
});
document.addEventListener('change',function(ev){
  var el=ev.target;if(!el||el.id!=='rf'||!el.files||!el.files[0])return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(fr.result),m=o&&o.mem;
      if(!m||!Array.isArray(m.log)||typeof m.w!=='object')throw new Error('bad');
      MEM=m;normMem();saveMem();
      if(o.session&&o.session.active){SAVED=o.session;ls.set(K_SESS,JSON.stringify(o.session));dbWrite('session',o.session)}
      render();toast('Backup restored.');
    }catch(e){toast('That file is not an Iron Plan backup.')}
  };
  fr.readAsText(el.files[0]);el.value='';
});
document.addEventListener('input',function(ev){
  if(ev.target&&ev.target.id==='fb'){G.rep.fb=ev.target.value;var rp=document.getElementById('rp');if(rp)rp.value=reportText()}
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&sess&&sess.i>=0&&sess.stage!=='done'){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){})}catch(e){}}
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&ev.target&&ev.target.id==='cw'){tryUnlock()}
});
function tryUnlock(){
  var cw=document.getElementById('cw');
  var v=(cw&&cw.value||'').replace(/[^a-z]/gi,'').toUpperCase();
  if(v===CODEWORD){
    beep(1);var sv=activeSaved();
    if(sv&&sv.day===G.day)resumeSession();else startSession();
  }else{G.err=true;render();var c2=document.getElementById('cw');if(c2)c2.focus()}
}

window.__IP={A:A,DAYS:DAYS,buildSteps:buildSteps,frame:frame,prep:prep,E:E,T:T,S:S,phases:phases,get sess(){return sess},get MEM(){return MEM},get SAVED(){return SAVED}};
initStore();
render();
})();
